function fmtPct(v){ return v.toFixed(0) + '%'; }
function drawChart(s, idx){
  const svg = document.getElementById('chart-' + idx);
  const w = svg.clientWidth || 800;
  const h = Math.max(260, Math.min(380, w * 0.44));
  svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
  svg.style.height = h + 'px';
  const padL = 52, padR = 18, padT = 20, padB = 38, plotW = w - padL - padR, plotH = h - padT - padB;
  const maxVal = Math.max.apply(null, s.points.map(function(p){ return p.value; }));
  const yMax = Math.max(100, Math.ceil(maxVal / 10) * 10);
  const n = s.points.length;
  const xAt = function(i){ return padL + (n > 1 ? i / (n - 1) * plotW : 0); };
  const yAt = function(v){ return padT + plotH - v / yMax * plotH; };
  let html = '';
  for (let i = 0; i <= 5; i++){
    const v = yMax * i / 5, y = yAt(v);
    html += '<line class="grid-line" x1="' + padL + '" y1="' + y + '" x2="' + (w - padR) + '" y2="' + y + '"></line>';
    html += '<text class="y-label" x="' + (padL - 8) + '" y="' + (y + 4) + '">' + fmtPct(v) + '</text>';
  }
  html += '<line class="axis-line" x1="' + padL + '" y1="' + padT + '" x2="' + padL + '" y2="' + (padT + plotH) + '"></line>';
  html += '<line class="axis-line" x1="' + padL + '" y1="' + (padT + plotH) + '" x2="' + (w - padR) + '" y2="' + (padT + plotH) + '"></line>';
  const labels = new Set();
  const step = Math.max(1, Math.ceil((n - 1) / 8));
  for (let i = 0; i < n; i += step) labels.add(i);
  labels.add(n - 1);
  labels.forEach(function(i){ html += '<text class="x-label" x="' + xAt(i) + '" y="' + (h - 14) + '">' + s.points[i].label + '</text>'; });
  const pts = s.points.map(function(p, i){ return xAt(i) + ',' + yAt(p.value); }).join(' ');
  html += '<polyline fill="none" stroke="' + s.color + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="' + pts + '"></polyline>';
  s.points.forEach(function(p, i){
    const tip = s.name + ' · ' + p.label + '（第' + p.day + '日）\n仓位 ' + p.value.toFixed(1) + '%';
    html += '<g class="point" transform="translate(' + xAt(i) + ',' + yAt(p.value) + ')"><circle r="3" fill="' + s.color + '"><title>' + tip + '</title></circle></g>';
  });
  svg.innerHTML = html;
}
function renderCharts(){
  const el = document.getElementById('charts');
  el.innerHTML = P.series.map(function(s, i){
    return '<div class="card"><div class="chart-head"><span class="swatch" style="background:' + s.color + '"></span>' + s.name + '</div><svg id="chart-' + i + '" role="img" aria-label="' + s.name + ' 仓位百分比折线图"></svg></div>';
  }).join('');
  P.series.forEach(function(s, i){ drawChart(s, i); });
}
renderCharts();
window.addEventListener('resize', function(){ P.series.forEach(function(s, i){ drawChart(s, i); }); });
