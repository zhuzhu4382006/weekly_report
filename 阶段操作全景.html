    .phase-block.collapsed .phase-arrow { transform:rotate(-90deg); }
    .phase-body { padding:14px 16px; }
    .phase-block.collapsed .phase-body { display:none; }

    .mobile-only { display:none; }

      .mobile-only { display:block; }
    }

function pad(n){ return n < 10 ? '0' + n : '' + n; }
function fmtCN(iso){
  var a = iso.split('-');
  return parseInt(a[1],10) + '月' + parseInt(a[2],10) + '日';
}
function fmt(n){ return Number(n).toFixed(2); }
function fmtPct(n){ return (n >= 0 ? '+' : '') + Number(n).toFixed(1) + '%'; }
function fmtSigned(n){ return (n >= 0 ? '+' : '-') + fmt(Math.abs(n)); }

function getResolvedDate(){
  var now = new Date();
  // 22:00 后:解锁第二天的行情,日期前进一天;22:00 前:显示当天行情
  if (now.getHours() >= 22) {
    now.setDate(now.getDate() + 1);
  }
  var s = now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate());
  if (s > P.latestDate) s = P.latestDate;
  return s;
}

var PREVIEW = window.location.hash.indexOf('preview') >= 0;
document.addEventListener('keydown', function(e){
  if (e.ctrlKey && e.shiftKey && (e.key === 'K' || e.key === 'k')){
    e.preventDefault();
    PREVIEW = true;
    render();
  }
});

function renderNotice(resolved, locked){
  var el = document.getElementById('lockNotice');
  if (locked){
    el.className = 'lock-notice locked';
    el.innerHTML = '🔒 最新（' + fmtCN(P.latestDate) + '）数据 22:00 解锁 · 当前显示至 ' + fmtCN(resolved);
  } else {
    el.className = 'lock-notice open';
    el.innerHTML = '✅ 全部数据已解锁 · 截至 ' + fmtCN(P.latestDate);
  }
}

// 某阶段内 <=resolved 的数据(倒序: 最新在前)
function phaseVisibleDays(ph, resolved){
  return ph.days.filter(function(d){ return d.iso <= resolved; }).slice().reverse();
}
function phaseVisibleOps(ph, resolved){
  return ph.ops.filter(function(o){ return o.iso <= resolved; }).slice().reverse();
}

// 阶段顶部行情条: 阶段初价 -> 阶段内最新价
function renderStrip(container, ph, resolved){
  var vdays = phaseVisibleDays(ph, resolved);
  var end = vdays.length ? vdays[0].prices : null;
  var html = '';
  for (var sid of ['A','B','C']){
    var sp = ph.startPrices[sid].p;
    var ep = end ? end[sid].p : sp;
    var chg = sp > 0 ? (ep - sp) / sp * 100 : 0;
    var cls = chg >= 0 ? 'up' : 'down';
    var arrow = chg >= 0 ? '▲' : '▼';
    html += '<div class="strip-item">';
    html += '<div class="strip-name">' + ({A:'天枢能源',B:'玉衡材料',C:'摇光电子'}[sid]) + '</div>';
    html += '<div class="strip-price">' + fmt(sp) + ' → ' + fmt(ep) + '</div>';
    html += '<div class="strip-chg ' + cls + '">' + arrow + ' ' + fmtPct(chg) + '</div>';
    html += '</div>';
  }
  var note = '<div style="grid-column:1/-1;font-size:12px;color:#6b7280;">第' + ph.startDay + '-' + ph.endDay + '日 · ' + ph.startLabel + ' → ' + (vdays.length ? fmtCN(vdays[0].iso) : '') + '</div>';
  html += note;
  container.innerHTML = html;
}

// 渲染单个阶段的网格(桌面)与移动版
function renderPhaseGrid(container, ph, resolved, locked){
  var vdays = phaseVisibleDays(ph, resolved);
  var vops = phaseVisibleOps(ph, resolved);
  var pc = P.players.length;

  var html = '<div class="grid-wrap" style="--player-count:' + pc + ';">';
  html += '<div class="grid-row"><div class="cell head">日期 / 行情</div>';
  for (var p of P.players) html += '<div class="cell head">' + p + '</div>';
  html += '</div>';

  for (var i = 0; i < vdays.length; i++){
    var d = vdays[i];
    var opsToday = vops.filter(function(o){ return o.day === d.day; });
    var prices = '';
    for (var sid of ['A','B','C']){
      var px = d.prices[sid];
      var cls = px.c >= 0 ? 'up' : 'down';
      var arrow = px.c >= 0 ? '▲' : '▼';
      prices += '<div class="px"><span class="px-name">' + ({A:'天枢能源',B:'玉衡材料',C:'摇光电子'}[sid]) + '</span> <b>' + fmt(px.p) + '</b> <span class="' + cls + '">' + arrow + ' ' + fmtPct(px.c) + '</span></div>';
    }
    html += '<div class="grid-row"><div class="cell day"><div class="day-date">' + d.label + '</div><div class="day-num">第' + d.day + '日</div><div class="prices">' + prices + '</div></div>';
    for (var p of P.players){
      var ops = opsToday.filter(function(o){ return o.name === p; });
      if (!ops.length){
        html += '<div class="cell player empty">—</div>';
        continue;
      }
      var blocks = '';
      for (var t of ops){
        var cls2 = t.type === 'buy' ? 'buy' : 'sell';
        var label = t.type === 'buy' ? '买入' : (t.is_clear ? '卖出（清仓）' : '卖出');
        blocks += '<div class="op-block"><div class="op ' + cls2 + '">' + label + ' ' + t.stock + '</div><div class="op-hold">持：' + (t.held.length ? t.held.join(' · ') : '空仓') + '</div></div>';
      }
      html += '<div class="cell player">' + blocks + '</div>';
    }
    html += '</div>';
  }
  html += '</div>';

  // 移动版
  var mhtml = '<div class="mday-list">';
  for (var i = 0; i < vdays.length; i++){
    var d = vdays[i];
    var opsToday = vops.filter(function(o){ return o.day === d.day; });
    var priceParts = [];
    for (var sid of ['A','B','C']){
      var px = d.prices[sid];
      var cls = px.c >= 0 ? 'up' : 'down';
      var arrow = px.c >= 0 ? '▲' : '▼';
      priceParts.push(({A:'天枢能源',B:'玉衡材料',C:'摇光电子'}[sid]) + ' ' + fmt(px.p) + ' <span class="' + cls + '">' + arrow + ' ' + fmtPct(px.c) + '</span>');
    }
    mhtml += '<div class="mday">';
    mhtml += '<div class="mday-head"><div class="mday-date">' + d.label + ' <span class="mday-num">第' + d.day + '日</span></div><div class="mday-prices">' + priceParts.join(' · ') + '</div></div>';
    if (!opsToday.length){
      mhtml += '<div class="mplayer" style="color:#9aa1ad;font-size:13px;">当日无人操作</div>';
    }
    for (var p of P.players){
      var ops = opsToday.filter(function(o){ return o.name === p; });
      if (!ops.length) continue;
      var blocks = '';
      for (var t of ops){
        var cls2 = t.type === 'buy' ? 'buy' : 'sell';
        var label = t.type === 'buy' ? '买入' : (t.is_clear ? '卖出（清仓）' : '卖出');
        blocks += '<div class="op-block"><div class="op ' + cls2 + '">' + label + ' ' + t.stock + '</div><div class="op-hold">持：' + (t.held.length ? t.held.join(' · ') : '空仓') + '</div></div>';
      }
      mhtml += '<div class="mplayer"><div class="mplayer-name">' + p + '</div><div class="mplayer-ops">' + blocks + '</div></div>';
    }
    mhtml += '</div>';
  }
  mhtml += '</div>';

  container.innerHTML =
    '<div class="table-wrap" style="margin-bottom:8px;">' + html + '</div>' +
    '<div class="mobile-only">' + mhtml + '</div>';
}

function render(){
  var resolved = PREVIEW ? P.latestDate : getResolvedDate();
  var locked = resolved < P.latestDate;
  renderNotice(resolved, locked);

  var root = document.getElementById('phases');
  var out = '';
  for (var ph of P.phases){
    var collapsedCls = ph.current ? '' : ' collapsed';
    var tag = ph.current ? '<span class="phase-tag">当前阶段</span>' : '';
    out += '<div class="phase-block' + collapsedCls + '" data-phase="' + ph.no + '">';
    out += '<div class="phase-head" onclick="togglePhase(this)">';
    out += '<span class="phase-no">阶段 ' + ph.no + '</span>' + tag;
    out += '<span class="phase-range">第' + ph.startDay + '-' + ph.endDay + '日 · ' + ph.startLabel + ' → ' + ph.endLabel + '</span>';
    out += '<span class="phase-arrow">▼</span></div>';
    out += '<div class="phase-body"><div class="strip" id="strip_' + ph.no + '"></div>';
    out += '<div id="grid_' + ph.no + '"></div></div>';
    out += '</div>';
  }
  root.innerHTML = out;

  for (var ph of P.phases){
    renderStrip(document.getElementById('strip_' + ph.no), ph, resolved);
    renderPhaseGrid(document.getElementById('grid_' + ph.no), ph, resolved, locked);
  }
}

function togglePhase(head){
  var block = head.parentElement;
  block.classList.toggle('collapsed');
}
render();
</script>
