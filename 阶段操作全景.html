function pad(n){ return n < 10 ? '0' + n : '' + n; }
function fmtCN(iso){
  var a = iso.split('-');
  return parseInt(a[1],10) + '月' + parseInt(a[2],10) + '日';
}
function fmt(n){ return Number(n).toFixed(2); }
function fmtPct(n){ return (n >= 0 ? '+' : '') + Number(n).toFixed(1) + '%'; }
function fmtSigned(n){ return (n >= 0 ? '+' : '-') + fmt(Math.abs(n)); }

function getResolvedDate(){
  var now = new Date();
  if (now.getHours() < 9) now.setDate(now.getDate() - 1);
  var s = now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate());
  if (s > P.latestDate) s = P.latestDate;
  return s;
}

var PREVIEW = window.location.hash.indexOf('preview') >= 0;
document.addEventListener('keydown', function(e){
  if (e.ctrlKey && e.shiftKey && (e.key === 'K' || e.key === 'k')){
    e.preventDefault();
    PREVIEW = true;
    render();
  }
});

function visibleDays(resolved){
  return P.days.filter(function(d){ return d.iso <= resolved; });
}
function visibleOps(resolved){
  return P.ops.filter(function(o){ return o.iso <= resolved; });
}

function renderNotice(resolved, locked){
  var el = document.getElementById('lockNotice');
  if (locked){
    el.className = 'lock-notice locked';
    el.innerHTML = '🔒 最新（' + fmtCN(P.latestDate) + '）数据 9:00 解锁 · 当前显示至 ' + fmtCN(resolved);
  } else {
    el.className = 'lock-notice open';
    el.innerHTML = '✅ 全部数据已解锁 · 截至 ' + fmtCN(P.latestDate);
  }
}

function renderStrip(resolved, locked){
  var vdays = visibleDays(resolved);
  var end = vdays.length ? vdays[vdays.length - 1].prices : null;
  var html = '';
  for (var sid of ['A','B','C']){
    var sp = P.startPrices[sid];
    var ep = end ? end[sid].p : sp;
    var chg = sp > 0 ? (ep - sp) / sp * 100 : 0;
    var cls = chg >= 0 ? 'up' : 'down';
    var arrow = chg >= 0 ? '▲' : '▼';
    html += '<div class="strip-item">';
    html += '<div class="strip-name">' + ({A:'天枢能源',B:'玉衡材料',C:'摇光电子'}[sid]) + '</div>';
    html += '<div class="strip-price">' + fmt(sp) + ' → ' + fmt(ep) + '</div>';
    html += '<div class="strip-chg ' + cls + '">' + arrow + ' ' + fmtPct(chg) + '</div>';
    html += '</div>';
  }
  var el = document.getElementById('strip');
  el.innerHTML = html;
  var first = el.firstChild;
  var note = document.createElement('div');
  note.style.cssText = 'grid-column:1/-1;font-size:12px;color:#6b7280;';
  note.textContent = '阶段初 ' + P.phaseStartLabel + ' → 截至 ' + fmtCN(resolved);
  el.appendChild(note);
}

function renderGrid(resolved, locked){
  var vdays = visibleDays(resolved);
  var vops = visibleOps(resolved);
  var html = '<div class="grid-row"><div class="cell head">日期 / 行情</div>';
  for (var p of P.players) html += '<div class="cell head">' + p + '</div>';
  html += '</div>';

  for (var i = 0; i < vdays.length; i++){
    var d = vdays[i];
    var opsToday = vops.filter(function(o){ return o.day === d.day; });
    if (!opsToday.length) continue;
    var prices = '';
    for (var sid of ['A','B','C']){
      var px = d.prices[sid];
      var cls = px.c >= 0 ? 'up' : 'down';
      var arrow = px.c >= 0 ? '▲' : '▼';
      prices += '<div class="px"><span class="px-name">' + ({A:'天枢能源',B:'玉衡材料',C:'摇光电子'}[sid]) + '</span> <b>' + fmt(px.p) + '</b> <span class="' + cls + '">' + arrow + ' ' + fmtPct(px.c) + '</span></div>';
    }
    html += '<div class="grid-row"><div class="cell day"><div class="day-date">' + d.label + '</div><div class="day-num">第' + d.day + '日</div><div class="prices">' + prices + '</div></div>';
    for (var p of P.players){
      var ops = opsToday.filter(function(o){ return o.name === p; });
      if (!ops.length){
        html += '<div class="cell player empty">—</div>';
        continue;
      }
      var blocks = '';
      for (var t of ops){
        var cls2 = t.type === 'buy' ? 'buy' : 'sell';
        var label = t.type === 'buy' ? '买入' : (t.is_clear ? '卖出（清仓）' : '卖出');
        blocks += '<div class="op-block"><div class="op ' + cls2 + '">' + label + ' ' + t.stock + '</div><div class="op-hold">持：' + (t.held.length ? t.held.join(' · ') : '空仓') + '</div></div>';
      }
      html += '<div class="cell player">' + blocks + '</div>';
    }
    html += '</div>';
  }
  document.getElementById('grid').innerHTML = html;
}

function render(){
  var resolved = PREVIEW ? P.latestDate : getResolvedDate();
  var locked = resolved < P.latestDate;
  renderNotice(resolved, locked);
  renderStrip(resolved, locked);
  renderGrid(resolved, locked);
}
render();
</script>
