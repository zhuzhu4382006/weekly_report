<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>阶段操作全景</title><style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#eef1f6; font-family:"Microsoft YaHei","PingFang SC",-apple-system,sans-serif; }
    .card { width:100%; max-width:1240px; margin:0 auto; background:#fff; padding:26px 28px 22px; }
    .card-head { border-bottom:3px solid #1f2a44; padding-bottom:16px; margin-bottom:16px; }
    .title { font-size:30px; font-weight:800; color:#1f2a44; }
    .sub { font-size:14px; color:#6b7280; margin-top:6px; }
    .lock-notice { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:14px; padding:10px 14px; border-radius:10px; font-size:13px; overflow-wrap:anywhere; }
    .lock-notice.locked { background:#fff7e6; color:#b26a00; border:1px solid #ffe1a8; }
    .lock-notice.open { background:#e8f7ee; color:#1c7d43; border:1px solid #bfe6cd; }
    .strip { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px; }
    .strip-item { border:1px solid #e5e7eb; border-radius:12px; padding:12px 16px; background:#f8fafc; }
    .strip-name { font-size:15px; font-weight:700; color:#1f2a44; }
    .strip-price { font-size:18px; font-weight:800; margin-top:4px; }
    .strip-chg { font-size:14px; font-weight:700; margin-top:3px; }
    .table-wrap { overflow-x:auto; }
    .grid-wrap { min-width:max(1080px, calc(330px + var(--player-count, 6) * 140px)); }
    .grid-row { display:grid; grid-template-columns:330px repeat(var(--player-count, 6), minmax(0,1fr)); gap:0; border-bottom:1px solid #eef1f5; }
    .grid-row:last-child { border-bottom:none; }
    .cell { padding:12px 10px; min-width:0; }
    .head { border-bottom:2px solid #1f2a44; background:#f3f5f9; font-weight:800; font-size:15px; color:#1f2a44; text-align:center; }
    .day { background:#fbfcfe; }
    .day-date { font-size:19px; font-weight:800; color:#1f2a44; }
    .day-num { font-size:12px; color:#9aa1ad; margin-bottom:6px; }
    .prices { font-size:12px; line-height:1.8; color:#374151; overflow-wrap:anywhere; }
    .px-name { color:#6b7280; }
    .up { color:#d93025; }
    .down { color:#188038; }
    .player { border-left:1px solid #eef1f5; }
    .player.empty { color:#c3c9d2; text-align:center; }
    .op-block { margin-bottom:8px; }
    .op-block:last-child { margin-bottom:0; }
    .op { display:inline-block; font-size:13px; font-weight:700; border-radius:6px; padding:2px 8px; overflow-wrap:anywhere; }
    .op.buy { background:#fde8e8; color:#c62828; }
    .op.sell { background:#e6f4ea; color:#1e7d34; }
    .op-hold { font-size:11px; color:#6b7280; margin-top:3px; overflow-wrap:anywhere; }
    .foot { margin-top:16px; font-size:12px; color:#9aa1ad; border-top:1px solid #eef1f5; padding-top:12px; }
    #gridMobile { display:none; }
    .mday { border:1px solid #e5e7eb; border-radius:12px; padding:12px; margin-bottom:12px; background:#fbfcfe; }
    .mday-head { border-bottom:1px solid #eef1f5; padding-bottom:8px; margin-bottom:6px; }
    .mday-date { font-size:17px; font-weight:800; color:#1f2a44; }
    .mday-num { font-size:11px; color:#9aa1ad; margin-bottom:5px; }
    .mday-prices { font-size:12px; line-height:1.7; color:#374151; overflow-wrap:anywhere; }
    .mplayer { display:flex; gap:8px; padding:7px 0; border-bottom:1px dashed #eef1f5; }
    .mplayer:last-child { border-bottom:none; }
    .mplayer-name { flex:0 0 60px; font-weight:700; font-size:14px; padding-top:2px; color:#1f2a44; }
    .mplayer-ops { flex:1; min-width:0; }
    .mplayer-ops .op-block { margin-bottom:5px; }
    .mplayer-ops .op-block:last-child { margin-bottom:0; }
    @media (max-width:820px) {
      .card { padding:16px 12px; }
      .title { font-size:22px; }
      .sub { font-size:12px; }
      .strip { grid-template-columns:1fr; gap:8px; }
      .strip-price { font-size:16px; }
      #gridDesktop { display:none; }
      #gridMobile { display:block; }
    }
    </style></head>
<body>
<div class="card">
  <div class="card-head">
    <div class="title">📋 阶段操作全景</div>
    <div class="sub">第 188-211 交易日 · 谁在哪天、股价怎么变化时做了什么操作</div>
  </div>
  <div class="lock-notice" id="lockNotice"></div>
  <div class="strip" id="strip"></div>
  <div class="table-wrap"><div class="grid-wrap" id="gridDesktop"></div></div>
  <div id="gridMobile"></div>
  <div class="foot">红涨绿跌 · 买入红标 / 卖出绿标 · 持仓为操作前持仓，仅显示有无不显示数量 · 最新数据每日 9:00 解锁</div>
</div>
<script>
const P = {"phaseStartDay":188,"phaseStartIso":"2026-08-10","phaseStartLabel":"8/10","latestDay":211,"latestDate":"2026-08-15","startPrices":{"A":3.72,"B":43.2,"C":26.72},"days":[{"day":191,"iso":"2026-08-11","label":"8/11","prices":{"A":{"p":3.73,"c":0.5},"B":{"p":41.95,"c":-2.6},"C":{"p":27.06,"c":0.0}}},{"day":196,"iso":"2026-08-12","label":"8/12","prices":{"A":{"p":3.72,"c":-0.3},"B":{"p":48.2,"c":14.9},"C":{"p":26.57,"c":-1.8}}},{"day":201,"iso":"2026-08-13","label":"8/13","prices":{"A":{"p":3.8,"c":2.2},"B":{"p":51.55,"c":7.0},"C":{"p":27.08,"c":1.9}}},{"day":206,"iso":"2026-08-14","label":"8/14","prices":{"A":{"p":3.84,"c":1.1},"B":{"p":48.65,"c":-5.6},"C":{"p":27.12,"c":0.1}}},{"day":211,"iso":"2026-08-15","label":"8/15","prices":{"A":{"p":3.82,"c":-0.5},"B":{"p":54.8,"c":12.6},"C":{"p":27.9,"c":2.9}}}],"ops":[{"name":"受受","day":196,"iso":"2026-08-12","label":"8/12","type":"buy","sid":"C","stock":"摇光电子","is_clear":false,"held":["天枢能源"]},{"name":"受受","day":201,"iso":"2026-08-13","label":"8/13","type":"buy","sid":"B","stock":"玉衡材料","is_clear":false,"held":["天枢能源","摇光电子"]},{"name":"蟹蟹","day":191,"iso":"2026-08-11","label":"8/11","type":"buy","sid":"A","stock":"天枢能源","is_clear":false,"held":["天枢能源","玉衡材料","摇光电子"]},{"name":"蟹蟹","day":191,"iso":"2026-08-11","label":"8/11","type":"sell","sid":"C","stock":"摇光电子","is_clear":false,"held":["天枢能源","玉衡材料","摇光电子"]},{"name":"蟹蟹","day":196,"iso":"2026-08-12","label":"8/12","type":"sell","sid":"B","stock":"玉衡材料","is_clear":true,"held":["天枢能源","玉衡材料","摇光电子"]},{"name":"蟹蟹","day":206,"iso":"2026-08-14","label":"8/14","type":"buy","sid":"C","stock":"摇光电子","is_clear":false,"held":["天枢能源","摇光电子"]},{"name":"飞鸟","day":196,"iso":"2026-08-12","label":"8/12","type":"buy","sid":"A","stock":"天枢能源","is_clear":false,"held":["天枢能源"]},{"name":"鹅蛋","day":201,"iso":"2026-08-13","label":"8/13","type":"buy","sid":"A","stock":"天枢能源","is_clear":false,"held":["天枢能源","摇光电子"]},{"name":"鹅蛋","day":206,"iso":"2026-08-14","label":"8/14","type":"buy","sid":"A","stock":"天枢能源","is_clear":false,"held":["天枢能源","摇光电子"]},{"name":"鹅蛋","day":206,"iso":"2026-08-14","label":"8/14","type":"sell","sid":"C","stock":"摇光电子","is_clear":false,"held":["天枢能源","摇光电子"]},{"name":"若梦","day":196,"iso":"2026-08-12","label":"8/12","type":"buy","sid":"A","stock":"天枢能源","is_clear":false,"held":[]},{"name":"若梦","day":196,"iso":"2026-08-12","label":"8/12","type":"buy","sid":"C","stock":"摇光电子","is_clear":false,"held":["天枢能源"]},{"name":"若梦","day":201,"iso":"2026-08-13","label":"8/13","type":"buy","sid":"B","stock":"玉衡材料","is_clear":false,"held":["天枢能源","摇光电子"]},{"name":"若梦","day":206,"iso":"2026-08-14","label":"8/14","type":"buy","sid":"A","stock":"天枢能源","is_clear":false,"held":["天枢能源","玉衡材料","摇光电子"]},{"name":"若梦","day":206,"iso":"2026-08-14","label":"8/14","type":"buy","sid":"B","stock":"玉衡材料","is_clear":false,"held":["天枢能源","玉衡材料","摇光电子"]}],"players":["受受","小玉","蟹蟹","飞鸟","鹅蛋","若梦"]};

function pad(n){ return n < 10 ? '0' + n : '' + n; }
function fmtCN(iso){
  var a = iso.split('-');
  return parseInt(a[1],10) + '月' + parseInt(a[2],10) + '日';
}
function fmt(n){ return Number(n).toFixed(2); }
function fmtPct(n){ return (n >= 0 ? '+' : '') + Number(n).toFixed(1) + '%'; }
function fmtSigned(n){ return (n >= 0 ? '+' : '-') + fmt(Math.abs(n)); }

function getResolvedDate(){
  var now = new Date();
  if (now.getHours() < 9) now.setDate(now.getDate() - 1);
  var s = now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate());
  if (s > P.latestDate) s = P.latestDate;
  return s;
}

var PREVIEW = window.location.hash.indexOf('preview') >= 0;
document.addEventListener('keydown', function(e){
  if (e.ctrlKey && e.shiftKey && (e.key === 'K' || e.key === 'k')){
    e.preventDefault();
    PREVIEW = true;
    render();
  }
});

function visibleDays(resolved){
  return P.days.filter(function(d){ return d.iso <= resolved; });
}
function visibleOps(resolved){
  return P.ops.filter(function(o){ return o.iso <= resolved; });
}

function renderNotice(resolved, locked){
  var el = document.getElementById('lockNotice');
  if (locked){
    el.className = 'lock-notice locked';
    el.innerHTML = '🔒 最新（' + fmtCN(P.latestDate) + '）数据 9:00 解锁 · 当前显示至 ' + fmtCN(resolved);
  } else {
    el.className = 'lock-notice open';
    el.innerHTML = '✅ 全部数据已解锁 · 截至 ' + fmtCN(P.latestDate);
  }
}

function renderStrip(resolved, locked){
  var vdays = visibleDays(resolved);
  var end = vdays.length ? vdays[vdays.length - 1].prices : null;
  var html = '';
  for (var sid of ['A','B','C']){
    var sp = P.startPrices[sid];
    var ep = end ? end[sid].p : sp;
    var chg = sp > 0 ? (ep - sp) / sp * 100 : 0;
    var cls = chg >= 0 ? 'up' : 'down';
    var arrow = chg >= 0 ? '▲' : '▼';
    html += '<div class="strip-item">';
    html += '<div class="strip-name">' + ({A:'天枢能源',B:'玉衡材料',C:'摇光电子'}[sid]) + '</div>';
    html += '<div class="strip-price">' + fmt(sp) + ' → ' + fmt(ep) + '</div>';
    html += '<div class="strip-chg ' + cls + '">' + arrow + ' ' + fmtPct(chg) + '</div>';
    html += '</div>';
  }
  var el = document.getElementById('strip');
  el.innerHTML = html;
  var first = el.firstChild;
  var note = document.createElement('div');
  note.style.cssText = 'grid-column:1/-1;font-size:12px;color:#6b7280;';
  note.textContent = '阶段初 ' + P.phaseStartLabel + ' → 截至 ' + fmtCN(resolved);
  el.appendChild(note);
}

function renderGrid(resolved, locked){
  var vdays = visibleDays(resolved);
  var vops = visibleOps(resolved);
  document.getElementById('gridDesktop').style.setProperty('--player-count', P.players.length);
  var html = '<div class="grid-row"><div class="cell head">日期 / 行情</div>';
  for (var p of P.players) html += '<div class="cell head">' + p + '</div>';
  html += '</div>';

  for (var i = 0; i < vdays.length; i++){
    var d = vdays[i];
    var opsToday = vops.filter(function(o){ return o.day === d.day; });
    if (!opsToday.length) continue;
    var prices = '';
    for (var sid of ['A','B','C']){
      var px = d.prices[sid];
      var cls = px.c >= 0 ? 'up' : 'down';
      var arrow = px.c >= 0 ? '▲' : '▼';
      prices += '<div class="px"><span class="px-name">' + ({A:'天枢能源',B:'玉衡材料',C:'摇光电子'}[sid]) + '</span> <b>' + fmt(px.p) + '</b> <span class="' + cls + '">' + arrow + ' ' + fmtPct(px.c) + '</span></div>';
    }
    html += '<div class="grid-row"><div class="cell day"><div class="day-date">' + d.label + '</div><div class="day-num">第' + d.day + '日</div><div class="prices">' + prices + '</div></div>';
    for (var p of P.players){
      var ops = opsToday.filter(function(o){ return o.name === p; });
      if (!ops.length){
        html += '<div class="cell player empty">—</div>';
        continue;
      }
      var blocks = '';
      for (var t of ops){
        var cls2 = t.type === 'buy' ? 'buy' : 'sell';
        var label = t.type === 'buy' ? '买入' : (t.is_clear ? '卖出（清仓）' : '卖出');
        blocks += '<div class="op-block"><div class="op ' + cls2 + '">' + label + ' ' + t.stock + '</div><div class="op-hold">持：' + (t.held.length ? t.held.join(' · ') : '空仓') + '</div></div>';
      }
      html += '<div class="cell player">' + blocks + '</div>';
    }
    html += '</div>';
  }
  document.getElementById('gridDesktop').innerHTML = html;

  var mhtml = '';
  for (var i = 0; i < vdays.length; i++){
    var d = vdays[i];
    var opsToday = vops.filter(function(o){ return o.day === d.day; });
    if (!opsToday.length) continue;
    var priceParts = [];
    for (var sid of ['A','B','C']){
      var px = d.prices[sid];
      var cls = px.c >= 0 ? 'up' : 'down';
      var arrow = px.c >= 0 ? '▲' : '▼';
      priceParts.push(({A:'天枢能源',B:'玉衡材料',C:'摇光电子'}[sid]) + ' ' + fmt(px.p) + ' <span class="' + cls + '">' + arrow + ' ' + fmtPct(px.c) + '</span>');
    }
    mhtml += '<div class="mday">';
    mhtml += '<div class="mday-head"><div class="mday-date">' + d.label + ' <span class="mday-num">第' + d.day + '日</span></div><div class="mday-prices">' + priceParts.join(' · ') + '</div></div>';
    for (var p of P.players){
      var ops = opsToday.filter(function(o){ return o.name === p; });
      if (!ops.length) continue;
      var blocks = '';
      for (var t of ops){
        var cls2 = t.type === 'buy' ? 'buy' : 'sell';
        var label = t.type === 'buy' ? '买入' : (t.is_clear ? '卖出（清仓）' : '卖出');
        blocks += '<div class="op-block"><div class="op ' + cls2 + '">' + label + ' ' + t.stock + '</div><div class="op-hold">持：' + (t.held.length ? t.held.join(' · ') : '空仓') + '</div></div>';
      }
      mhtml += '<div class="mplayer"><div class="mplayer-name">' + p + '</div><div class="mplayer-ops">' + blocks + '</div></div>';
    }
    mhtml += '</div>';
  }
  document.getElementById('gridMobile').innerHTML = mhtml;
}

function render(){
  var resolved = PREVIEW ? P.latestDate : getResolvedDate();
  var locked = resolved < P.latestDate;
  renderNotice(resolved, locked);
  renderStrip(resolved, locked);
  renderGrid(resolved, locked);
}
render();
</script>
</body>
</html>
