  wanLabel: function (p) { return (p.value / 10000).toFixed(1) + '万'; },
  yuan: function (v) { return v == null ? '-' : Math.round(v).toLocaleString('zh-CN') + ' 元'; },
  signedMoney: function (p) { var v = p.value; return (v > 0 ? '+' : '') + Math.round(v).toLocaleString('zh-CN'); },
  pct1: function (p) { var v = p.value[2]; return (v > 0 ? '+' : '') + v.toFixed(1) + '%'; },
  pctSigned: function (v) { return v == null ? '-' : (v > 0 ? '+' : '') + Number(v).toFixed(2) + '%'; },
  signColor: function (p) { return p.value >= 0 ? '#e74c3c' : '#27ae60'; },
  heatTip: function (p) { return p.value[2] + '%'; },
  tradeTip: function (p) {
    var d = p.data;
    var t = d[3] === 'buy' ? '买入' : '卖出';
    return '<b>' + d[6] + '</b> ' + t + ' ' + d[4] + '<br/>价格 ' + d[5] +
           ' · ' + d[2] + ' 股<br/><span style="color:#64748b">' + (d[7] || '') +
           (d[8] ? '　' + d[8] : '') + '</span>';
  },
  axisTradeTip: function (ps) {
    if (!ps || !ps.length) return '';
    var html = '<b>' + (ps[0].axisValueLabel || ps[0].axisValue || '') + '</b>';
    for (var i = 0; i < ps.length; i++) {
      var p = ps[i];
      if (p.value == null) continue;
      if (p.seriesType === 'scatter') {
        var d = p.data;
        if (!d || !d.length) continue;
        html += '<br/><span style="color:' + (d[3] === 'buy' ? '#e74c3c' : '#27ae60') + '">●</span> ' +
                (d[3] === 'buy' ? '买入' : '卖出') + ' ' + d[4] + ' ' + d[2] + ' 股 @' + d[5] +
                (d[6] ? '<br/><span style="color:#64748b;font-size:11px">' + d[6] + '</span>' : '');
      } else {
        html += '<br/>' + p.marker + ' ' + p.seriesName + ' ' + Number(p.value).toFixed(1);
      }
    }
    return html;
  },
  sellTip: function (ps) {
    var p = ps[0];
    if (!p) return '';
    var d = p.data || {};
    var html = '<b>' + p.name + '　' + (d.stock || '') + '</b>';
    html += '<br/><span style="color:' + (p.value >= 0 ? '#e74c3c' : '#27ae60') + '">盈亏 ' +
            (p.value > 0 ? '+' : '') + Math.round(p.value).toLocaleString('zh-CN') + ' 元</span>';
    if (d.qty) html += '<br/>' + d.qty + ' 股 @' + d.price;
    if (d.reason) html += '<br/><span style="color:#64748b;font-size:11px">' + d.reason + '</span>';
    return html;
  }
};
function revive(o) {
  if (Array.isArray(o)) { for (var i = 0; i < o.length; i++) o[i] = revive(o[i]); return o; }
  if (o && typeof o === 'object') {
    if (o.__fn && FN[o.__fn]) return FN[o.__fn];
    for (var k in o) o[k] = revive(o[k]);
    return o;
  }
  return o;
}
(function () {
  function render() {
    var box = document.getElementById('charts');
    CHARTS.forEach(function (c) {
      var card = document.createElement('div'); card.className = 'card';
      var t = document.createElement('div'); t.className = 'card-title'; t.textContent = c.title; card.appendChild(t);
      if (c.note) { var n = document.createElement('div'); n.className = 'card-note'; n.textContent = c.note; card.appendChild(n); }
      var el = document.createElement('div'); el.className = 'chart'; el.style.height = (c.height || 300) + 'px';
      card.appendChild(el); box.appendChild(card);
      var chart = echarts.init(el);
      chart.setOption(revive(c.option));
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render); else render();
  window.addEventListener('resize', function () {
    var els = document.querySelectorAll('.chart');
    for (var i = 0; i < els.length; i++) { var c = echarts.getInstanceByDom(els[i]); if (c) c.resize(); }
  });
})();
</script>
</body>
</html>
