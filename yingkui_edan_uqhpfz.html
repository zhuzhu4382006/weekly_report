<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>盈亏日历 · 鹅蛋</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  background:#f3f4f8; color:#1a1a2e; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap { max-width:640px; margin:0 auto; padding:14px 12px 40px; }

.header {
  background:#fff; border-radius:14px; padding:14px 16px;
  display:flex; align-items:center; gap:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.06); margin-bottom:12px;
}
.avatar {
  width:46px; height:46px; border-radius:50%;
  background:linear-gradient(135deg,#fde8e8,#ffe9d1);
  display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0;
}
.title { font-size:17px; font-weight:700; }
.subtitle { font-size:12px; color:#8a8fa3; margin-top:2px; }

.lock-notice { text-align:center; padding:10px 14px; border-radius:10px; font-size:13px; margin-bottom:12px; }
.lock-notice.locked { background:#fff7e6; color:#b26a00; border:1px solid #ffe1a8; }
.lock-notice.open { background:#e8f7ee; color:#1c7d43; border:1px solid #bfe6cd; }

.card { background:#fff; border-radius:14px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.06); margin-bottom:12px; }
.card-title { font-size:15px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.asof { font-size:11px; font-weight:400; color:#8a8fa3; }

.sum-row { display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px dashed #f0f1f5; font-size:14px; gap:12px; }
.sum-row:last-child { border-bottom:none; }
.sum-label { color:#6b7080; flex-shrink:0; }
.sum-val { font-weight:600; text-align:right; }
.sum-val.up { color:#e74c3c; }
.sum-val.down { color:#27ae60; }
.sum-val.big { font-size:17px; font-weight:700; }
.sum-val.warn { color:#e67e22; }

.hold-title { font-size:13px; font-weight:700; margin:14px 0 8px; color:#4a4f63; }
.holding { border:1px solid #eef0f4; border-radius:10px; padding:10px 12px; margin-bottom:8px; background:#fafbfc; }
.hd-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px; }
.hd-name { font-weight:700; font-size:14px; }
.hd-mv { font-size:12px; color:#6b7080; flex-shrink:0; }
.hd-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:7px 10px; }
.hd-label { font-size:10px; color:#8a8fa3; margin-bottom:1px; }
.hd-val { font-size:13px; font-weight:600; word-break:break-all; }
.hd-val.up { color:#e74c3c; }
.hd-val.down { color:#27ae60; }
.lock-line {
  background:#f8f9fb; border:1px dashed #dde1e8; border-radius:8px;
  padding:12px; text-align:center; color:#8a8fa3; font-size:13px;
}

/* ---- 最近交易 ---- */
.card-trade-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:10px; flex-wrap:wrap; }
.table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
.trade-table { width:100%; border-collapse:collapse; font-size:13px; min-width:640px; }
.trade-table th { background:#f3f5f9; font-weight:700; color:#4a4f63; padding:8px 10px; text-align:center; border-bottom:2px solid #e2e6ee; white-space:nowrap; }
.trade-table td { padding:8px 10px; text-align:center; border-bottom:1px solid #eef0f4; white-space:nowrap; }
.trade-table td.tl { text-align:left; }
.trade-table .b { color:#e74c3c; font-weight:700; }
.trade-table .s { color:#27ae60; font-weight:700; }
.trade-reason { max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.trade-empty { text-align:center; color:#9aa1ad; padding:20px 0; font-size:13px; }

.phase-row { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px dashed #f0f1f5; gap:10px; }
.phase-row:last-child { border-bottom:none; }
.phase-info { min-width:0; }
.phase-name { font-size:14px; font-weight:700; }
.phase-range { font-size:11px; color:#8a8fa3; display:block; margin-top:1px; }
.phase-right { text-align:right; flex-shrink:0; }
.phase-rate { font-size:16px; font-weight:700; }
.phase-rate.up { color:#e74c3c; }
.phase-rate.down { color:#27ae60; }
.phase-sub { font-size:11px; color:#8a8fa3; margin-top:1px; }

.pstats { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
.pstat { background:#f8f9fb; border-radius:10px; padding:10px 12px; min-width:0; }
.pstat-label { font-size:11px; color:#8a8fa3; margin-bottom:3px; }
.pstat-val { font-size:14px; font-weight:700; word-break:break-all; }
.pstat-val.up { color:#e74c3c; }
.pstat-val.down { color:#27ae60; }
.pstat-sub { font-size:11px; color:#8a8fa3; margin-top:2px; }
.pstat .lock-line { margin-top:4px; }

.month-label { font-size:14px; font-weight:700; margin:4px 0 6px; }
.grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
.dow { font-size:10px; color:#aab0c0; text-align:center; padding:3px 0; }
.cell { border-radius:6px; padding:3px 0 4px; min-height:44px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.cell.pos { background:rgba(231,76,60,.08); }
.cell.neg { background:rgba(39,174,96,.08); }
.cell.none { background:#fafafa; }
.cd { font-size:10px; color:#888; line-height:1.2; }
.cp { font-size:13px; font-weight:700; line-height:1.3; }
.cell.pos .cp { color:#e74c3c; }
.cell.neg .cp { color:#27ae60; }
.cell.none .cd { color:#e2e2e8; }

.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:14px; padding:10px 6px; background:#f8f9fa; border-radius:10px; }
.stat { text-align:center; }
.stat-label { font-size:10px; color:#999; }
.stat-val { font-size:13px; font-weight:700; }
.stat-val.up { color:#e74c3c; }
.stat-val.down { color:#27ae60; }

.footer { text-align:center; font-size:11px; color:#aab0c0; margin-top:20px; line-height:1.8; }
.footer a { color:#6a7fae; text-decoration:none; }

@media (max-width:600px) {
  .wrap { padding:10px 8px 32px; }
  .cell { min-height:40px; }
  .cp { font-size:12px; }
  .pstats { grid-template-columns:1fr; }
}
</style>
</head>

// ---------- 工具 ----------
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function fmtMoney(n){
  n = Number(n) || 0;
  return '¥' + n.toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtSigned(n){
  n = Number(n) || 0;
  return (n >= 0 ? '+' : '-') + fmtMoney(Math.abs(n));
}
function fmtCN(dateStr){
  var a = dateStr.split('-');
  return parseInt(a[1],10) + '月' + parseInt(a[2],10) + '日';
}

// ---------- 解锁判定(与 K线页一致:每天 0 点后即解锁当天) ----------
function getResolvedDate(){
  var now = new Date();
  var s = now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate());
  if (s > P.latestDate) s = P.latestDate;
  return s;
}

// 组织者预览:网址加 #preview,或 Ctrl+Shift+K
var PREVIEW = window.location.hash.indexOf('preview') >= 0;
document.addEventListener('keydown', function(e){
  if (e.ctrlKey && e.shiftKey && (e.key === 'K' || e.key === 'k')){
    e.preventDefault();
    PREVIEW = true;
    render();
  }
});

// ---------- 渲染 ----------
function getAcc(dateStr){
  if (P.accounts[dateStr]) return P.accounts[dateStr];
  var keys = Object.keys(P.accounts).sort();
  for (var i = keys.length - 1; i >= 0; i--) if (keys[i] <= dateStr) return P.accounts[keys[i]];
  return P.accounts[keys[0]] || {};
}
function getInvested(dateStr){
  if (P.invested[dateStr] != null) return P.invested[dateStr];
  var keys = Object.keys(P.invested).sort();
  for (var i = keys.length - 1; i >= 0; i--) if (keys[i] <= dateStr) return P.invested[keys[i]];
  return 100000;
}

// 未解锁时,个人统计只按已解锁日期重算,不提前透露最新一天的数据
function getPeriodStats(resolved){
  var keys = Object.keys(P.accounts).filter(function(d){ return d <= resolved; }).sort();
  var dayMap = {};
  for (var i = 0; i < P.days.length; i++) dayMap[P.days[i].d] = P.days[i];

  var maxDrawdown = 0, peakNw = 100000;
  var maxProfit = -Infinity, maxProfitPct = 0;
  var bestAmt = 0, bestAmtPct = 0, bestAmtInfo = '';
  var bestPct = 0, bestPctAmt = 0, bestPctInfo = '';
  var worstAmt = 0, worstAmtPct = 0, worstAmtInfo = '';
  var worstPct = 0, worstPctAmt = 0, worstPctInfo = '';

  for (var i = 0; i < keys.length; i++){
    var d = keys[i];
    var nw = P.accounts[d].nw;
    if (nw == null) continue;
    if (nw > peakNw) peakNw = nw;
    var dd = peakNw > 0 ? (peakNw - nw) / peakNw * 100 : 0;
    if (dd > maxDrawdown) maxDrawdown = dd;
    var inv = getInvested(d);
    var profit = nw - inv;
    var pct = inv > 0 ? profit / inv * 100 : 0;
    if (profit > maxProfit){ maxProfit = profit; maxProfitPct = pct; }
  }
  if (maxProfit === -Infinity) maxProfit = 0;

  for (var i = 1; i < keys.length; i++){
    var prevD = keys[i-1], currD = keys[i];
    var prevNw = P.accounts[prevD].nw, currNw = P.accounts[currD].nw;
    if (prevNw == null || currNw == null || prevNw <= 0) continue;
    var day = dayMap[currD];
    var change = day ? day.p : ((currNw - prevNw) - 0);
    var changePct = prevNw > 0 ? change / prevNw * 100 : 0;
    var info = day ? (keys[i-1] + ' → ' + currD) : '';
    if (change > bestAmt){ bestAmt = change; bestAmtPct = changePct; bestAmtInfo = info; }
    if (changePct > bestPct){ bestPct = changePct; bestPctAmt = change; bestPctInfo = info; }
    if (change < worstAmt){ worstAmt = change; worstAmtPct = changePct; worstAmtInfo = info; }
    if (changePct < worstPct){ worstPct = changePct; worstPctAmt = change; worstPctInfo = info; }
  }

  return {
    maxDrawdown: maxDrawdown,
    maxProfit: maxProfit,
    maxProfitPct: maxProfitPct,
    bestAmt: bestAmt, bestAmtPct: bestAmtPct, bestAmtInfo: bestAmtInfo,
    bestPct: bestPct, bestPctAmt: bestPctAmt, bestPctInfo: bestPctInfo,
    worstAmt: worstAmt, worstAmtPct: worstAmtPct, worstAmtInfo: worstAmtInfo,
    worstPct: worstPct, worstPctAmt: worstPctAmt, worstPctInfo: worstPctInfo
  };
}

      var tcls = spl.total >= 0 ? 'up' : 'down';
      var tsign = spl.total >= 0 ? '+' : '-';
      splHtml += '<div><span style="margin-right:8px;">' + stockNames[si] + '：<span class="' + tcls + '" style="font-weight:600;">' + tsign + fmtMoney(Math.abs(spl.total)) + '</span></span><span style="font-size:11px;color:#8a8fa3;">（已实现 ' + (spl.realized >= 0 ? '+' : '-') + fmtMoney(Math.abs(spl.realized)) + ' ｜ 未实现 ' + (spl.unrealized >= 0 ? '+' : '-') + fmtMoney(Math.abs(spl.unrealized)) + '）</span></div>';
    }
  } else {
    splHtml = '<div class="lock-line">🔒 单支股票盈亏 0:00 解锁</div>';
  }
  html += '<div class="pstat" style="grid-column:1/-1;"><div class="pstat-label">📈 单支股票盈亏</div><div style="font-size:13px;line-height:2;margin-top:4px;">' + splHtml + '</div></div>';

  html += '<div class="pstat"><div class="pstat-label">📉 最大回撤</div><div class="pstat-val down">-' + ps.maxDrawdown.toFixed(2) + '%</div><div class="pstat-sub">从最高点回落的最大幅度</div></div>';
  html += '<div class="pstat"><div class="pstat-label">🏔️ 最高盈利</div><div class="pstat-val ' + (ps.maxProfit >= 0 ? 'up' : 'down') + '">' + (ps.maxProfit >= 0 ? '+' : '-') + fmtMoney(Math.abs(ps.maxProfit)) + '</div><div class="pstat-sub">曾达到的最高点（' + (ps.maxProfitPct >= 0 ? '+' : '') + ps.maxProfitPct.toFixed(2) + '%）</div></div>';

  html += '<div class="pstat"><div class="pstat-label">🔴 单日最高盈利</div><div class="pstat-val up">' + (ps.bestAmt > 0 ? '+' + fmtMoney(ps.bestAmt) : '-') + '</div><div class="pstat-sub">' + (ps.bestAmtInfo || '无') + '（+' + ps.bestAmtPct.toFixed(2) + '%）</div></div>';
  html += '<div class="pstat"><div class="pstat-label">🔴 单日最高收益率</div><div class="pstat-val up">+' + ps.bestPct.toFixed(2) + '%</div><div class="pstat-sub">' + (ps.bestPctInfo || '无') + '（+' + fmtMoney(ps.bestPctAmt) + '）</div></div>';
  html += '<div class="pstat"><div class="pstat-label">🟢 单日最高亏损</div><div class="pstat-val down">' + fmtMoney(ps.worstAmt) + '</div><div class="pstat-sub">' + (ps.worstAmtInfo || '无') + '（' + ps.worstAmtPct.toFixed(2) + '%）</div></div>';
  html += '<div class="pstat"><div class="pstat-label">🟢 单日最高亏损率</div><div class="pstat-val down">' + ps.worstPct.toFixed(2) + '%</div><div class="pstat-sub">' + (ps.worstPctInfo || '无') + '（' + fmtMoney(ps.worstPctAmt) + '）</div></div>';

  html += '</div>';
  document.getElementById('statsCard').innerHTML = html;
}

function renderCalendar(resolved){
  var days = [];
  for (var i = 0; i < P.days.length; i++) if (P.days[i].d <= resolved) days.push(P.days[i]);

  var monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  var byMonth = {};
  for (var j = 0; j < days.length; j++){
    var mk = days[j].d.substring(0, 7);
    (byMonth[mk] = byMonth[mk] || []).push(days[j]);
  }

  var html = '<div class="card-title" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;">📅 每日盈亏 <span class="asof">红赚 · 绿亏</span><button id="calModeBtn" onclick="toggleCalMode()" style="font-size:12px;padding:4px 12px;border-radius:20px;border:1px solid #d5dbe6;background:#f8fafc;color:#4a6cf7;cursor:pointer;font-weight:600;">' + (calShowPct ? '切换金额' : '切换百分比') + '</button></div>';
  var mkeys = Object.keys(byMonth).sort().reverse();
  for (var k = 0; k < mkeys.length; k++){
    var mk2 = mkeys[k];
    var y = parseInt(mk2.split('-')[0], 10), m = parseInt(mk2.split('-')[1], 10) - 1;
    var label = y + '年 ' + monthNames[m];
    var firstDow = new Date(y, m, 1).getDay();
    var dim = new Date(y, m + 1, 0).getDate();
    var mdays = byMonth[mk2];

    html += '<div class="month"><div class="month-label">' + label + '</div><div class="grid">';
    var dows = ['日','一','二','三','四','五','六'];
    for (var w = 0; w < 7; w++) html += '<div class="dow">' + dows[w] + '</div>';
    for (var b = 0; b < firstDow; b++) html += '<div class="cell none"></div>';
    for (var day = 1; day <= dim; day++){
      var ds = mk2 + '-' + pad(day);
      var dd = null;
      for (var x = 0; x < mdays.length; x++) if (mdays[x].d === ds) { dd = mdays[x]; break; }
      if (dd){
        var pos = dd.p >= 0;
        var disp;
        if (calShowPct){
          disp = (pos ? '+' : '') + dd.pct.toFixed(1) + '%';
        } else {
          disp = (pos ? '+' : '') + dd.p.toFixed(0);
        }
        html += '<div class="cell ' + (pos ? 'pos' : 'neg') + '"><div class="cd">' + day + '</div><div class="cp">' + disp + '</div></div>';
      } else {
        html += '<div class="cell none"><div class="cd">' + day + '</div></div>';
      }
    }
    html += '</div></div>';
  }

  var total = 0, posDays = 0, negDays = 0;
  for (var s = 0; s < days.length; s++){
    total += days[s].p;
    if (days[s].p > 0) posDays++; else if (days[s].p < 0) negDays++;
  }
  var avg = days.length ? total / days.length : 0;
  var tcls = total >= 0 ? 'up' : 'down', acls = avg >= 0 ? 'up' : 'down';
  html += '<div class="stats">';
  html += '<div class="stat"><div class="stat-label">总盈亏</div><div class="stat-val ' + tcls + '">' + (total >= 0 ? '+' : '') + total.toFixed(0) + '</div></div>';
  html += '<div class="stat"><div class="stat-label">盈利天数</div><div class="stat-val up">' + posDays + '</div></div>';
  html += '<div class="stat"><div class="stat-label">亏损天数</div><div class="stat-val down">' + negDays + '</div></div>';
  html += '<div class="stat"><div class="stat-label">日均</div><div class="stat-val ' + acls + '">' + (avg >= 0 ? '+' : '') + avg.toFixed(0) + '</div></div>';
  html += '</div>';

  document.getElementById('calendarCard').innerHTML = html;
}

// 个人收益曲线(超额收益, 横坐标=现实日期) — 类似仪表盘
function renderEarnChart(resolved){
  var el = document.getElementById('earnChart');
  if (!el || typeof echarts === 'undefined') return;
  // 数据: 每个已解锁的现实日, 超额收益 = nw - invested
  var days = [];
  var excess = [];
  var accKeys = Object.keys(P.accounts).sort();
  for (var i = 0; i < accKeys.length; i++){
    var d = accKeys[i];
    if (d > resolved) break;
    var nw = P.accounts[d] ? P.accounts[d].nw : null;
    if (nw == null) continue;
    var inv = (P.invested && P.invested[d] != null) ? P.invested[d] : 0;
    days.push(d);
    excess.push(+(nw - inv).toFixed(2));
  }
  if (days.length < 2){
    el.innerHTML = '<div style="text-align:center;color:#9aa1ad;padding:30px 0;font-size:13px;">数据不足，暂无法绘制收益曲线</div>';
    return;
  }
  var chart = echarts.getInstanceByDom(el);
  if (!chart) chart = echarts.init(el);

  // 现实日期格式化: YYYY-MM-DD -> M/D
  function fmtDate(s){
    var a = s.split('-');
    return parseInt(a[1],10) + '/' + parseInt(a[2],10);
  }
  var xs = days.map(fmtDate);

  var option = {
    animation: false,
    tooltip: {
      trigger: 'axis',
      backgroundColor: 'rgba(26,26,46,0.9)',
      borderWidth: 0,
      textStyle: { color: '#fff', fontSize: 12 },
      formatter: function(params){
        var i = params[0].dataIndex;
        var v = params[0].value;
        var sign = v >= 0 ? '+' : '';
        var col = v >= 0 ? '#e74c3c' : '#27ae60';
        return '<strong>' + days[i] + '</strong><br/>' +
          '<span style="color:' + col + ';font-weight:700;">超额收益 ' + sign + fmtMoney(v) + '</span>';
      }
    },
    grid: { left: 56, right: 20, top: 24, bottom: 30 },
    xAxis: {
      type: 'category',
      data: xs,
      axisLabel: { fontSize: 11 },
      axisLine: { lineStyle: { color: '#d5dbe6' } },
      splitLine: { show: false }
    },
    yAxis: {
      type: 'value',
      axisLabel: { fontSize: 11 },
      splitLine: { lineStyle: { type: 'dashed', color: '#eef0f4' } }
    },
    series: [{
      type: 'line',
      data: excess,
      smooth: true,
      symbol: 'circle',
      symbolSize: 5,
      lineStyle: { width: 2, color: '#2563eb' },
      itemStyle: { color: '#2563eb' },
      areaStyle: { color: 'rgba(37,99,235,0.08)' }
    }]
  };
  chart.setOption(option, true);
  window.addEventListener('resize', function(){ if (chart) chart.resize(); });
}

function renderTrades(){
  var filter = document.getElementById('tradeFilter');
  var sid = filter ? filter.value : '';
  var txs = P.trades || [];
  if (sid) txs = txs.filter(function(t){ return t.stockId === sid; });
  var el = document.getElementById('tradeList');
  if (!el) return;
  if (!txs.length){
    el.innerHTML = '<div class="trade-empty">暂无交易记录</div>';
    return;
  }
  var rows = txs.map(function(t){
    var isBuy = t.type === 'buy';
    var cls = isBuy ? 'b' : 's';
    var label = isBuy ? '买入' : '卖出';
    var amount = (t.qty * t.price).toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2});
    var r = t.reason || '-';
    return '<tr>' +
      '<td>' + t.d + '</td>' +
      '<td>' + t.stock + '</td>' +
      '<td class="' + cls + '">' + label + '</td>' +
      '<td>' + (t.qty||0).toLocaleString() + '</td>' +
      '<td>¥' + Number(t.price).toFixed(3) + '</td>' +
      '<td>¥' + amount + '</td>' +
      '<td class="trade-reason tl" title="' + r.replace(/"/g,'&quot;') + '">' + r + '</td>' +
      '</tr>';
  }).join('');
  el.innerHTML =
    '<div class="table-wrap"><table class="trade-table">' +
    '<thead><tr><th>日期</th><th>股票</th><th>类型</th><th>数量</th><th>价格</th><th>金额</th><th>理由</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table></div>';
}

function render(){
  var resolved = PREVIEW ? P.latestDate : getResolvedDate();
  var locked = resolved < P.latestDate;
  renderNotice(locked, resolved);
  renderSummary(resolved, locked);
  renderPhases(resolved);
  renderStats(resolved, locked);
  renderEarnChart(resolved);
  renderCalendar(resolved);
  renderTrades();
}

document.addEventListener('change', function(e){
  if (e.target && e.target.id === 'tradeFilter') renderTrades();
});

render();
</script>
</body>
</html>
