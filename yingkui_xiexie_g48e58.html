function fmtCN(dateStr){
  var a = dateStr.split('-');
  return parseInt(a[1],10) + '月' + parseInt(a[2],10) + '日';
}

// ---------- 解锁判定(与 K线页一致:每天 0 点后即解锁当天) ----------
function getResolvedDate(){
  var now = new Date();
  var s = now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate());
  if (s > P.latestDate) s = P.latestDate;
  return s;
}

// 组织者预览:网址加 #preview,或 Ctrl+Shift+K
var PREVIEW = window.location.hash.indexOf('preview') >= 0;
document.addEventListener('keydown', function(e){
  if (e.ctrlKey && e.shiftKey && (e.key === 'K' || e.key === 'k')){
    e.preventDefault();
    PREVIEW = true;
    render();
  }
});

// ---------- 渲染 ----------
function getAcc(dateStr){
  if (P.accounts[dateStr]) return P.accounts[dateStr];
  var keys = Object.keys(P.accounts).sort();
  for (var i = keys.length - 1; i >= 0; i--) if (keys[i] <= dateStr) return P.accounts[keys[i]];
  return P.accounts[keys[0]] || {};
}
function getInvested(dateStr){
  if (P.invested[dateStr] != null) return P.invested[dateStr];
  var keys = Object.keys(P.invested).sort();
  for (var i = keys.length - 1; i >= 0; i--) if (keys[i] <= dateStr) return P.invested[keys[i]];
  return 100000;
}

// 未解锁时,个人统计只按已解锁日期重算,不提前透露最新一天的数据
function getPeriodStats(resolved){
  var keys = Object.keys(P.accounts).filter(function(d){ return d <= resolved; }).sort();
  var dayMap = {};
  for (var i = 0; i < P.days.length; i++) dayMap[P.days[i].d] = P.days[i];

  var maxDrawdown = 0, peakNw = 100000;
  var maxProfit = -Infinity, maxProfitPct = 0;
  var bestAmt = 0, bestAmtPct = 0, bestAmtInfo = '';
  var bestPct = 0, bestPctAmt = 0, bestPctInfo = '';
  var worstAmt = 0, worstAmtPct = 0, worstAmtInfo = '';
  var worstPct = 0, worstPctAmt = 0, worstPctInfo = '';

  for (var i = 0; i < keys.length; i++){
    var d = keys[i];
    var nw = P.accounts[d].nw;
    if (nw == null) continue;
    if (nw > peakNw) peakNw = nw;
    var dd = peakNw > 0 ? (peakNw - nw) / peakNw * 100 : 0;
    if (dd > maxDrawdown) maxDrawdown = dd;
    var inv = getInvested(d);
    var profit = nw - inv;
    var pct = inv > 0 ? profit / inv * 100 : 0;
    if (profit > maxProfit){ maxProfit = profit; maxProfitPct = pct; }
  }
  if (maxProfit === -Infinity) maxProfit = 0;

  for (var i = 1; i < keys.length; i++){
    var prevD = keys[i-1], currD = keys[i];
    var prevNw = P.accounts[prevD].nw, currNw = P.accounts[currD].nw;
    if (prevNw == null || currNw == null || prevNw <= 0) continue;
    var day = dayMap[currD];
    var change = day ? day.p : ((currNw - prevNw) - 0);
    var changePct = prevNw > 0 ? change / prevNw * 100 : 0;
    var info = day ? ('第' + day.g0 + '→' + day.g + '日') : '';
    if (change > bestAmt){ bestAmt = change; bestAmtPct = changePct; bestAmtInfo = info; }
    if (changePct > bestPct){ bestPct = changePct; bestPctAmt = change; bestPctInfo = info; }
    if (change < worstAmt){ worstAmt = change; worstAmtPct = changePct; worstAmtInfo = info; }
    if (changePct < worstPct){ worstPct = changePct; worstPctAmt = change; worstPctInfo = info; }
  }

  return {
    maxDrawdown: maxDrawdown,
    maxProfit: maxProfit,
    maxProfitPct: maxProfitPct,
    bestAmt: bestAmt, bestAmtPct: bestAmtPct, bestAmtInfo: bestAmtInfo,
    bestPct: bestPct, bestPctAmt: bestPctAmt, bestPctInfo: bestPctInfo,
    worstAmt: worstAmt, worstAmtPct: worstAmtPct, worstAmtInfo: worstAmtInfo,
    worstPct: worstPct, worstPctAmt: worstPctAmt, worstPctInfo: worstPctInfo
  };
}

function renderNotice(locked, resolved){
  var el = document.getElementById('lockNotice');
  if (locked){
    el.className = 'lock-notice locked';
    el.innerHTML = '🔒 已锁定:只显示到 <strong>' + fmtCN(resolved) + '</strong> · 最新(' + fmtCN(P.latestDate) + ')数据 <strong>0:00</strong> 解锁';
  } else {
    el.className = 'lock-notice open';
    el.innerHTML = '✅ 全部数据已解锁 · 截至 ' + fmtCN(P.latestDate);
  }
}

function renderSummary(resolved, locked){
  var acc = getAcc(resolved);
  var invested = getInvested(resolved);
  var nw = acc.nw, cash = acc.c, sv = acc.sv, md = acc.md || 0;
  var pl = nw - invested;
  var rpct = invested > 0 ? pl / invested * 100 : 0;
  var posPct = nw > 0 ? sv / nw * 100 : 0;
  var posCls = pl >= 0 ? 'up' : 'down';

  var html = '<div class="card-title">📊 账户摘要 <span class="asof">截至 ' + fmtCN(resolved) + '</span></div>';
  html += '<div class="sum-row"><span class="sum-label">💎 净资产</span><span class="sum-val big">' + fmtMoney(nw) + '</span></div>';
  html += '<div class="sum-row"><span class="sum-label">🏦 现金</span><span class="sum-val">' + fmtMoney(cash) + '</span></div>';
  html += '<div class="sum-row"><span class="sum-label">📈 持仓市值</span><span class="sum-val">' + fmtMoney(sv) + '</span></div>';
  if (md > 0) html += '<div class="sum-row"><span class="sum-label">🔻 融资负债</span><span class="sum-val warn">' + fmtMoney(md) + '</span></div>';
  html += '<div class="sum-row"><span class="sum-label">🎯 仓位占比</span><span class="sum-val">' + posPct.toFixed(1) + '% 持股 / ' + (100 - posPct).toFixed(1) + '% 现金</span></div>';
  html += '<div class="sum-row"><span class="sum-label">📥 累计投入</span><span class="sum-val">' + fmtMoney(invested) + '</span></div>';
  html += '<div class="sum-row"><span class="sum-label">📊 总盈亏</span><span class="sum-val ' + posCls + '">' + fmtSigned(pl) + ' <span style="font-weight:400;font-size:12px;">(' + (rpct >= 0 ? '+' : '') + rpct.toFixed(2) + '%)</span></span></div>';

  html += '<div class="hold-title">🧾 持仓明细</div>';
  var open = !locked && resolved === P.latestDate;
  if (open){
    var hs = P.latest.holdings;
    if (hs.length){
      for (var i = 0; i < hs.length; i++){
        var h = hs[i];
        html += '<div class="holding">';
        html += '<div class="hd-top"><span class="hd-name">' + h.name + '</span><span class="hd-mv">市值 ' + fmtMoney(h.mv) + '</span></div>';
        html += '<div class="hd-grid">';
        html += '<div class="hd-item"><div class="hd-label">持仓</div><div class="hd-val">' + h.shares.toLocaleString() + ' 股</div></div>';
        html += '<div class="hd-item"><div class="hd-label">均价</div><div class="hd-val">' + h.avg.toFixed(3) + '</div></div>';
        html += '<div class="hd-item"><div class="hd-label">现价</div><div class="hd-val">' + h.price.toFixed(3) + '</div></div>';
        html += '<div class="hd-item"><div class="hd-label">仓位</div><div class="hd-val">' + h.pct.toFixed(1) + '%</div></div>';
        html += '<div class="hd-item"><div class="hd-label">浮动盈亏</div><div class="hd-val ' + (h.up >= 0 ? 'up' : 'down') + '">' + fmtSigned(h.up) + ' <span style="font-weight:400;font-size:11px;">(' + (h.rpct >= 0 ? '+' : '') + h.rpct.toFixed(2) + '%)</span></div></div>';
        html += '<div class="hd-item"><div class="hd-label">累计盈亏</div><div class="hd-val ' + (h.cum >= 0 ? 'up' : 'down') + '">' + fmtSigned(h.cum) + '</div></div>';
        var lastS = P.days.length ? (P.days[P.days.length - 1].s || {}) : {};
        var hday = h.sid ? (lastS[h.sid] || 0) : 0;
        html += '<div class="hd-item"><div class="hd-label">当日盈亏</div><div class="hd-val ' + (hday >= 0 ? 'up' : 'down') + '">' + fmtSigned(hday) + '</div></div>';
        html += '</div></div>';
      }
    } else {
      html += '<div class="lock-line">(空仓)</div>';
    }
  } else {
    html += '<div class="lock-line">🔒 今日持仓明细 0:00 解锁</div>';
  }

  document.getElementById('summaryCard').innerHTML = html;
}

function renderPhases(resolved){
  var html = '<div class="card-title">🏆 阶段收益率 <span class="asof">仅本人可见</span></div>';
  for (var i = P.phases.length - 1; i >= 0; i--){
    var ph = P.phases[i];
    var rate = ph.rate, endNw = ph.endNw, endLabel = ph.end ? fmtCN(ph.end) : '';
    if (ph.ongoing){
      var acc = getAcc(resolved);
      endNw = acc.nw || 0;
      endLabel = fmtCN(resolved);
      rate = ph.startNw > 0 ? (endNw - ph.startNw) / ph.startNw * 100 : 0;
    }
    var cls = rate >= 0 ? 'up' : 'down';
    var name = '第' + ph.n + '阶段' + (ph.ongoing ? ' · 进行中' : '');
    html += '<div class="phase-row">';
    html += '<div class="phase-info"><span class="phase-name">' + name + '</span><span class="phase-range">' + fmtCN(ph.start) + ' - ' + endLabel + '</span></div>';
    html += '<div class="phase-right"><div class="phase-rate ' + cls + '">' + (rate >= 0 ? '+' : '') + rate.toFixed(2) + '%</div>';
    html += '<div class="phase-sub">' + fmtMoney(ph.startNw) + ' → ' + fmtMoney(endNw) + '</div></div>';
    html += '</div>';
  }
  document.getElementById('phaseCard').innerHTML = html;
}

function renderStats(resolved, locked){
  var acc = getAcc(resolved);
  var invested = getInvested(resolved);
  var nw = acc.nw || 0;
  var pl = nw - invested;
  var rpct = invested > 0 ? pl / invested * 100 : 0;
  var st = P.stats;
  var ps = getPeriodStats(resolved);
  var posCls = pl >= 0 ? 'up' : 'down';

  var html = '<div class="card-title">📊 个人统计 <span class="asof">截至 ' + fmtCN(resolved) + '</span></div>';
  html += '<div class="pstats">';

  html += '<div class="pstat"><div class="pstat-label">📊 总盈亏</div><div class="pstat-val ' + posCls + '">' + fmtSigned(pl) + '</div><div class="pstat-sub">收益率 ' + (rpct >= 0 ? '+' : '') + rpct.toFixed(2) + '%</div></div>';
  html += '<div class="pstat"><div class="pstat-label">💎 净资产</div><div class="pstat-val">' + fmtMoney(nw) + '</div><div class="pstat-sub">累计投入 ' + fmtMoney(invested) + '</div></div>';

  html += '<div class="pstat"><div class="pstat-label">🔄 交易次数</div><div class="pstat-val">' + st.totalTrades + '</div><div class="pstat-sub">买入 ' + st.buyCount + ' · 卖出 ' + st.sellCount + '</div></div>';
  html += '<div class="pstat"><div class="pstat-label">💸 手续费合计</div><div class="pstat-val">' + fmtMoney(st.totalFees) + '</div><div class="pstat-sub">成交总额 ' + fmtMoney(st.totalVolume) + '</div></div>';

  html += '<div class="pstat"><div class="pstat-label">📅 交易活跃期</div><div class="pstat-val" style="font-size:13px;">' + (st.firstTradeDay ? '第' + st.firstTradeDay + '日 → 第' + st.lastTradeDay + '日' : '无交易') + '</div><div class="pstat-sub">笔均 ' + fmtMoney(st.avgTradeSize) + '</div></div>';
  html += '<div class="pstat"><div class="pstat-label">🎯 偏好股票</div><div class="pstat-val" style="font-size:13px;">' + st.favStock + '</div></div>';

  html += '<div class="pstat"><div class="pstat-label">💰 工资收入</div><div class="pstat-val">' + fmtMoney(st.salaryTotal) + '</div><div class="pstat-sub">共 ' + st.salaryCount + ' 次</div></div>';
  html += '<div class="pstat"><div class="pstat-label">🔻 杠杆使用</div><div class="pstat-val" style="font-size:13px;' + (st.marginBorrowCount > 0 ? 'color:#e67e22;' : '') + '">' + (st.marginBorrowCount > 0 ? '借过 ' + st.marginBorrowCount + ' 次' : '未使用') + '</div><div class="pstat-sub">利息支出 ' + fmtMoney(st.marginInterest) + '</div></div>';

  var open = !locked && resolved === P.latestDate;
  var splHtml = '';
  if (open){
    var stockNames = ['天枢能源', '玉衡材料', '摇光电子'];
    for (var si = 0; si < 3; si++){
      var spl = st.stockPLs['ABC'.charAt(si)];
      var tcls = spl.total >= 0 ? 'up' : 'down';
      var tsign = spl.total >= 0 ? '+' : '-';
      splHtml += '<div><span style="margin-right:8px;">' + stockNames[si] + '：<span class="' + tcls + '" style="font-weight:600;">' + tsign + fmtMoney(Math.abs(spl.total)) + '</span></span><span style="font-size:11px;color:#8a8fa3;">（已实现 ' + (spl.realized >= 0 ? '+' : '-') + fmtMoney(Math.abs(spl.realized)) + ' ｜ 未实现 ' + (spl.unrealized >= 0 ? '+' : '-') + fmtMoney(Math.abs(spl.unrealized)) + '）</span></div>';
    }
  } else {
    splHtml = '<div class="lock-line">🔒 单支股票盈亏 0:00 解锁</div>';
  }
  html += '<div class="pstat" style="grid-column:1/-1;"><div class="pstat-label">📈 单支股票盈亏</div><div style="font-size:13px;line-height:2;margin-top:4px;">' + splHtml + '</div></div>';

  html += '<div class="pstat"><div class="pstat-label">📉 最大回撤</div><div class="pstat-val down">-' + ps.maxDrawdown.toFixed(2) + '%</div><div class="pstat-sub">从最高点回落的最大幅度</div></div>';
  html += '<div class="pstat"><div class="pstat-label">🏔️ 最高盈利</div><div class="pstat-val ' + (ps.maxProfit >= 0 ? 'up' : 'down') + '">' + (ps.maxProfit >= 0 ? '+' : '-') + fmtMoney(Math.abs(ps.maxProfit)) + '</div><div class="pstat-sub">曾达到的最高点（' + (ps.maxProfitPct >= 0 ? '+' : '') + ps.maxProfitPct.toFixed(2) + '%）</div></div>';

  html += '<div class="pstat"><div class="pstat-label">🔴 单日最高盈利</div><div class="pstat-val up">' + (ps.bestAmt > 0 ? '+' + fmtMoney(ps.bestAmt) : '-') + '</div><div class="pstat-sub">' + (ps.bestAmtInfo || '无') + '（+' + ps.bestAmtPct.toFixed(2) + '%）</div></div>';
  html += '<div class="pstat"><div class="pstat-label">🔴 单日最高收益率</div><div class="pstat-val up">+' + ps.bestPct.toFixed(2) + '%</div><div class="pstat-sub">' + (ps.bestPctInfo || '无') + '（+' + fmtMoney(ps.bestPctAmt) + '）</div></div>';
  html += '<div class="pstat"><div class="pstat-label">🟢 单日最高亏损</div><div class="pstat-val down">' + fmtMoney(ps.worstAmt) + '</div><div class="pstat-sub">' + (ps.worstAmtInfo || '无') + '（' + ps.worstAmtPct.toFixed(2) + '%）</div></div>';
  html += '<div class="pstat"><div class="pstat-label">🟢 单日最高亏损率</div><div class="pstat-val down">' + ps.worstPct.toFixed(2) + '%</div><div class="pstat-sub">' + (ps.worstPctInfo || '无') + '（' + fmtMoney(ps.worstPctAmt) + '）</div></div>';

  html += '</div>';
  document.getElementById('statsCard').innerHTML = html;
}

function renderCalendar(resolved){
  var days = [];
  for (var i = 0; i < P.days.length; i++) if (P.days[i].d <= resolved) days.push(P.days[i]);

  var monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  var byMonth = {};
  for (var j = 0; j < days.length; j++){
    var mk = days[j].d.substring(0, 7);
    (byMonth[mk] = byMonth[mk] || []).push(days[j]);
  }

  var html = '<div class="card-title">📅 每日盈亏 <span class="asof">红赚 · 绿亏</span></div>';
  var mkeys = Object.keys(byMonth).sort().reverse();
  for (var k = 0; k < mkeys.length; k++){
    var mk2 = mkeys[k];
    var y = parseInt(mk2.split('-')[0], 10), m = parseInt(mk2.split('-')[1], 10) - 1;
    var label = y + '年 ' + monthNames[m];
    var firstDow = new Date(y, m, 1).getDay();
    var dim = new Date(y, m + 1, 0).getDate();
    var mdays = byMonth[mk2];

    html += '<div class="month"><div class="month-label">' + label + '</div><div class="grid">';
    var dows = ['日','一','二','三','四','五','六'];
    for (var w = 0; w < 7; w++) html += '<div class="dow">' + dows[w] + '</div>';
    for (var b = 0; b < firstDow; b++) html += '<div class="cell none"></div>';
    for (var day = 1; day <= dim; day++){
      var ds = mk2 + '-' + pad(day);
      var dd = null;
      for (var x = 0; x < mdays.length; x++) if (mdays[x].d === ds) { dd = mdays[x]; break; }
      if (dd){
        var pos = dd.p >= 0;
        html += '<div class="cell ' + (pos ? 'pos' : 'neg') + '"><div class="cd">' + day + '</div><div class="cp">' + (pos ? '+' : '') + dd.p.toFixed(0) + '</div></div>';
      } else {
        html += '<div class="cell none"><div class="cd">' + day + '</div></div>';
      }
    }
    html += '</div></div>';
  }

  var total = 0, posDays = 0, negDays = 0;
  for (var s = 0; s < days.length; s++){
    total += days[s].p;
    if (days[s].p > 0) posDays++; else if (days[s].p < 0) negDays++;
  }
  var avg = days.length ? total / days.length : 0;
  var tcls = total >= 0 ? 'up' : 'down', acls = avg >= 0 ? 'up' : 'down';
  html += '<div class="stats">';
  html += '<div class="stat"><div class="stat-label">总盈亏</div><div class="stat-val ' + tcls + '">' + (total >= 0 ? '+' : '') + total.toFixed(0) + '</div></div>';
  html += '<div class="stat"><div class="stat-label">盈利天数</div><div class="stat-val up">' + posDays + '</div></div>';
  html += '<div class="stat"><div class="stat-label">亏损天数</div><div class="stat-val down">' + negDays + '</div></div>';
  html += '<div class="stat"><div class="stat-label">日均</div><div class="stat-val ' + acls + '">' + (avg >= 0 ? '+' : '') + avg.toFixed(0) + '</div></div>';
  html += '</div>';

  document.getElementById('calendarCard').innerHTML = html;
}

function render(){
  var resolved = PREVIEW ? P.latestDate : getResolvedDate();
  var locked = resolved < P.latestDate;
  renderNotice(locked, resolved);
  renderSummary(resolved, locked);
  renderPhases(resolved);
  renderStats(resolved, locked);
  renderCalendar(resolved);
}

render();
</script>
</body>
</html>
